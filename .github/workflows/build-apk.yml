name: Compilar APK A01 Optimizer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
      - name: Instalar dependencias do SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Gerar APK experimental
        run: gradle --no-daemon :app:assembleDebug
      - name: Disponibilizar o APK
        uses: actions/upload-artifact@v4
        with:
          name: A01-Optimizer-APK-experimental
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
