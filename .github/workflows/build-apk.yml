name: Build DebloaToast v0.10
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: a01-optimizer-v08-debug-key-v1
      - name: Ensure signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Compile release APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload current build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebloaToast-v0.10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish single stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk#DebloaToast-v0.10.apk"
          COMPANION="desktop/DebloaToast-Windows.zip#DebloaToast-Windows.zip"
          if gh release view v0.10 >/dev/null 2>&1; then
            gh release upload v0.10 "$APK" "$COMPANION" --clobber
            gh release edit v0.10 --title "DebloaToast v0.10" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create v0.10 "$APK" "$COMPANION" --title "DebloaToast v0.10" --notes-file RELEASE_NOTES.md --latest
          fi
      - name: Remove obsolete build artifacts and runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, (.workflow_run.id // 0)] | @tsv' |
          while IFS="$(printf '\t')" read -r id run_id; do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null 2>&1 || true
            fi
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[].id' |
          while read -r run_id; do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null 2>&1 || true
            fi
          done
